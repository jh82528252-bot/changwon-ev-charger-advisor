<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>창원시 전기차 충전소 추천 MVP (팔용동·중앙동·석동)</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e5e7eb;
      --ok-bg: #ecfdf5;
      --ok-text: #065f46;
      --warn-bg: #fffbeb;
      --warn-text: #92400e;
      --bad-bg: #fef2f2;
      --bad-text: #991b1b;
      --sim-bg: #eef2ff;
      --sim-text: #3730a3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: #111827;
      color: #fff;
      padding: 20px 24px;
    }
    header h1 { margin: 0 0 6px; font-size: 1.35rem; }
    header p { margin: 0; color: #d1d5db; font-size: 0.9rem; }
    .container {
      max-width: 1220px;
      margin: 20px auto;
      padding: 0 16px 40px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }
    @media (max-width: 920px) {
      .container { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 1.05rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      background: #fff;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      margin-top: 6px;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
      margin-top: 8px;
      font-size: 0.85rem;
    }
    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
      margin-top: 8px;
      font-size: 0.85rem;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-right: 6px;
    }
    .badge-sim { background: var(--sim-bg); color: var(--sim-text); }
    .badge-ok { background: var(--ok-bg); color: var(--ok-text); }
    .badge-warn { background: var(--warn-bg); color: var(--warn-text); }
    .badge-bad { background: var(--bad-bg); color: var(--bad-text); }
    .rec-card {
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 16px;
      background: #eff6ff;
      margin-bottom: 16px;
    }
    .alert-card {
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 16px;
      background: #fffbeb;
      margin-bottom: 16px;
    }
    .error-card {
      border: 2px solid #dc2626;
      border-radius: 12px;
      padding: 16px;
      background: #fef2f2;
      margin-bottom: 16px;
    }
    .alt-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      background: #fafafa;
      margin-bottom: 10px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }
    .metric {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .metric .k { font-size: 0.75rem; color: var(--muted); }
    .metric .v { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
